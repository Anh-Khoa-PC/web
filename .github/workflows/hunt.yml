name: Nexus Cloud 100h Strategy
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  nexus-hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Compiler
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Build Elite Hunter
        run: g++ -O3 -mavx2 -march=native -funroll-loops -pthread cloud_hunter.cpp -o nexus_hunter

      - name: Execute Session (5.5 Hours)
        run: |
          # Chạy background và giới hạn thời gian để kịp upload
          timeout 330m ./nexus_hunter || echo "Session finished"

      - name: Archive Results
        if: always()
        uses: actions/upload-artifact@v4 # ĐÃ SỬA THÀNH V4
        with:
          name: nexus-results-${{ github.run_id }}
          path: RESULT_CLOUD.txt
          retention-days: 3
          
